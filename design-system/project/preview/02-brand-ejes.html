<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Brand palette · 4 ejes</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg-page); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .eje { background: var(--bg-page); border-radius: var(--radius-lg);
         box-shadow: var(--neu-raised); padding: 18px 18px 16px; }
  .swatch { height: 64px; border-radius: var(--radius-md); margin-bottom: 12px;
            box-shadow: var(--elev-2); }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 15px;
          letter-spacing: -0.01em; color: var(--fg-1); }
  .role { font-family: var(--font-body); font-size: 11.5px; color: var(--fg-3);
          margin: 2px 0 8px; line-height: 1.35; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);
         letter-spacing: 0.02em; }
  .ramp { display: flex; gap: 3px; margin-top: 8px; }
  .ramp span { flex: 1; height: 14px; border-radius: 3px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="eje">
      <div class="swatch" style="background: var(--violeta-500)"></div>
      <div class="name">Morado</div>
      <div class="role">Igualdad de género</div>
      <div class="hex">#6E4BC4</div>
      <div class="ramp">
        <span style="background:var(--violeta-50)"></span>
        <span style="background:var(--violeta-100)"></span>
        <span style="background:var(--violeta-200)"></span>
        <span style="background:var(--violeta-400)"></span>
        <span style="background:var(--violeta-500)"></span>
        <span style="background:var(--violeta-700)"></span>
        <span style="background:var(--violeta-900)"></span>
      </div>
    </div>
    <div class="eje">
      <div class="swatch" style="background: var(--azul-500)"></div>
      <div class="name">Azul</div>
      <div class="role">Inclusión y no discriminación</div>
      <div class="hex">#2E8FCC</div>
      <div class="ramp">
        <span style="background:var(--azul-50)"></span>
        <span style="background:var(--azul-100)"></span>
        <span style="background:var(--azul-200)"></span>
        <span style="background:var(--azul-400)"></span>
        <span style="background:var(--azul-500)"></span>
        <span style="background:var(--azul-700)"></span>
        <span style="background:var(--azul-900)"></span>
      </div>
    </div>
    <div class="eje">
      <div class="swatch" style="background: var(--ambar-500)"></div>
      <div class="name">Amarillo</div>
      <div class="role">Cuidados corresponsables</div>
      <div class="hex">#F2A53A</div>
      <div class="ramp">
        <span style="background:var(--ambar-50)"></span>
        <span style="background:var(--ambar-100)"></span>
        <span style="background:var(--ambar-200)"></span>
        <span style="background:var(--ambar-400)"></span>
        <span style="background:var(--ambar-500)"></span>
        <span style="background:var(--ambar-700)"></span>
        <span style="background:var(--ambar-900)"></span>
      </div>
    </div>
    <div class="eje">
      <div class="swatch" style="background: var(--rosa-500)"></div>
      <div class="name">Rosa</div>
      <div class="role">Vida libre de discriminaciones y violencias</div>
      <div class="hex">#E63E9A</div>
      <div class="ramp">
        <span style="background:var(--rosa-50)"></span>
        <span style="background:var(--rosa-100)"></span>
        <span style="background:var(--rosa-200)"></span>
        <span style="background:var(--rosa-400)"></span>
        <span style="background:var(--rosa-500)"></span>
        <span style="background:var(--rosa-700)"></span>
        <span style="background:var(--rosa-900)"></span>
      </div>
    </div>
  </div>
</body>
</html>
