<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Admin accent</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg-page); }
  .row { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; }
  .sample { background: var(--bg-page); border-radius: var(--radius-lg);
            box-shadow: var(--neu-raised); padding: 18px; display: flex; gap: 14px; }
  .swatch-stack { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .sw { height: 38px; border-radius: var(--radius-sm); display: flex;
        align-items: center; justify-content: space-between; padding: 0 14px;
        font-family: var(--font-mono); font-size: 11px; color: white;
        font-weight: 500; box-shadow: var(--elev-1); }
  .sw .nm { font-family: var(--font-display); font-weight: 700; font-size: 12px; }

  .desc { flex: 1; }
  .h { font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--fg-1); }
  .p { font-family: var(--font-body); font-size: 11.5px; color: var(--fg-2);
       line-height: 1.5; margin-top: 6px; }
  .label { font-family: var(--font-body); font-weight: 700; font-size: 10.5px;
           color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.12em;
           margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sample">
      <div class="swatch-stack">
        <div class="label">Índigo · chrome del dashboard</div>
        <div class="sw" style="background: var(--indigo-500)"><span class="nm">Indigo 500</span><span>#3B3F8F</span></div>
        <div class="sw" style="background: var(--indigo-700)"><span class="nm">Indigo 700</span><span>#2C2F6E</span></div>
        <div class="sw" style="background: var(--indigo-900)"><span class="nm">Indigo 900</span><span>#1A1C46</span></div>
      </div>
    </div>
    <div class="sample">
      <div class="swatch-stack">
        <div class="label">Turquesa · acento primario admin</div>
        <div class="sw" style="background: var(--turquesa-100); color: var(--turquesa-900)"><span class="nm">Turq 100</span><span>#ABE3DE</span></div>
        <div class="sw" style="background: var(--turquesa-500)"><span class="nm">Turq 500</span><span>#14A8A0</span></div>
        <div class="sw" style="background: var(--turquesa-700)"><span class="nm">Turq 700</span><span>#0A7873</span></div>
      </div>
    </div>
  </div>
</body>
</html>
