<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>ONIGIES — Observatorio Nacional para la Igualdad de Género en las IES</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="site.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="TopBar.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="IndiceGauge.jsx"></script>
  <script type="text/babel" src="EjesGrid.jsx"></script>
  <script type="text/babel" src="HistoricalDots.jsx"></script>
  <script type="text/babel" src="AvanceHistogram.jsx"></script>
  <script type="text/babel" src="DescargasCard.jsx"></script>
  <script type="text/babel" src="IesTable.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    const App = () => {
      const [year, setYear] = React.useState(2026);
      const [activeEje, setActiveEje] = React.useState('rosa');
      const [filter, setFilter] = React.useState('');

      const histogramBins = [
        { label: '0.0', count: 1 },
        { label: '0.5', count: 3 },
        { label: '1.0', count: 5 },
        { label: '1.5', count: 8 },
        { label: '2.0', count: 14 },
        { label: '2.5', count: 10 },
        { label: '3.0', count: 4 },
        { label: '3.5', count: 2 },
        { label: '4.0', count: 1 },
        { label: '4.5', count: 0 },
      ];

      const history = [
        { year: 2021, value: 1.6 },
        { year: 2022, value: 1.4 },
        { year: 2023, value: 1.7 },
        { year: 2024, value: 1.8 },
        { year: 2025, value: 2.0 },
      ];

      return (
        <React.Fragment>
          <TopBar />
          <Hero year={year} onYearChange={setYear} />

          <main className="onig-page">
            <div className="onig-grid-main">
              <IndiceGauge value={2.0} />
              <AvanceHistogram bins={histogramBins} />
              <DescargasCard />
            </div>

            <div className="onig-grid-secondary">
              <HistoricalDots data={history} />
              <div className="onig-card" style={{display:'flex', flexDirection:'column', justifyContent:'center'}}>
                <div className="onig-card__label">Cobertura {year}</div>
                <div style={{display:'flex', gap:24, alignItems:'baseline'}}>
                  <div>
                    <div style={{fontFamily:'var(--font-display)', fontWeight:800, fontSize:48,
                                  lineHeight:1, color:'var(--primary-700)',
                                  fontVariantNumeric:'tabular-nums', letterSpacing:'-0.02em'}}>48</div>
                    <div style={{fontFamily:'var(--font-body)', fontSize:12, color:'var(--fg-3)', marginTop:4}}>
                      IES participantes
                    </div>
                  </div>
                  <div>
                    <div style={{fontFamily:'var(--font-display)', fontWeight:800, fontSize:48,
                                  lineHeight:1, color:'var(--azul-600)',
                                  fontVariantNumeric:'tabular-nums', letterSpacing:'-0.02em'}}>132</div>
                    <div style={{fontFamily:'var(--font-body)', fontSize:12, color:'var(--fg-3)', marginTop:4}}>
                      IES nacionales
                    </div>
                  </div>
                  <div>
                    <div style={{fontFamily:'var(--font-display)', fontWeight:800, fontSize:48,
                                  lineHeight:1, color:'var(--rosa-600)',
                                  fontVariantNumeric:'tabular-nums', letterSpacing:'-0.02em'}}>36%</div>
                    <div style={{fontFamily:'var(--font-body)', fontSize:12, color:'var(--fg-3)', marginTop:4}}>
                      del total nacional
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <EjesGrid active={activeEje} onSelect={setActiveEje} />

            <IesTable filter={filter} onFilter={setFilter} />
          </main>

          <Footer />
        </React.Fragment>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
