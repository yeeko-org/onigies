<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Chips & badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&display=block" rel="stylesheet">
<style>
  body { margin: 0; padding: 28px; background: var(--bg-page); }
  .group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px;}
  .label { font-family: var(--font-body); font-weight: 700; font-size: 10.5px;
           color: var(--fg-3); letter-spacing: 0.12em; text-transform: uppercase; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .chip { display: inline-flex; align-items: center; gap: 6px;
          padding: 6px 12px; border-radius: var(--radius-pill);
          font-family: var(--font-body); font-weight: 600; font-size: 12px; }
  .chip .material-symbols-rounded { font-size: 14px; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }

  .eje-rosa    { background: var(--rosa-50); color: var(--rosa-700); }
  .eje-rosa .dot    { background: var(--rosa-500); }
  .eje-violeta { background: var(--violeta-50); color: var(--violeta-700); }
  .eje-violeta .dot { background: var(--violeta-500); }
  .eje-azul    { background: var(--azul-50); color: var(--azul-700); }
  .eje-azul .dot    { background: var(--azul-500); }
  .eje-ambar   { background: var(--ambar-50); color: var(--ambar-700); }
  .eje-ambar .dot   { background: var(--ambar-500); }

  .status-ok  { background: var(--success-tint); color: var(--success); }
  .status-due { background: var(--warning-tint); color: var(--ambar-700); }
  .status-rej { background: var(--danger-tint); color: var(--danger); }

  .badge { display: inline-flex; align-items: center; justify-content: center;
           padding: 2px 8px; border-radius: 999px;
           font-family: var(--font-body); font-weight: 700; font-size: 11px;
           background: var(--violeta-500); color: white; }

  .score { display: inline-flex; align-items: center; gap: 6px;
           padding: 4px 10px 4px 4px; background: var(--bg-page);
           box-shadow: var(--neu-raised-sm); border-radius: 999px;
           font-family: var(--font-display); font-weight: 700; font-size: 13px;
           color: var(--fg-1); }
  .score .pill { width: 26px; height: 26px; border-radius: 50%;
                 display: flex; align-items: center; justify-content: center;
                 color: white; font-size: 11px; }
</style>
</head>
<body>
  <div class="group">
    <div class="label">Eje chips</div>
    <div class="row">
      <span class="chip eje-violeta"><span class="dot"></span>Igualdad de género</span>
      <span class="chip eje-azul"><span class="dot"></span>Inclusión y no discriminación</span>
      <span class="chip eje-ambar"><span class="dot"></span>Cuidados corresponsables</span>
      <span class="chip eje-rosa"><span class="dot"></span>Vida libre</span>
    </div>
  </div>
  <div class="group">
    <div class="label">Status chips</div>
    <div class="row">
      <span class="chip status-ok"><span class="material-symbols-rounded">check</span>Publicado</span>
      <span class="chip status-due"><span class="material-symbols-rounded">schedule</span>Pendiente revisión</span>
      <span class="chip status-rej"><span class="material-symbols-rounded">close</span>Evidencia rechazada</span>
      <span class="badge" style="background: var(--primary-500)">12 nuevas</span>
    </div>
  </div>
  <div class="group">
    <div class="label">Score pills</div>
    <div class="row">
      <span class="score"><span class="pill" style="background: var(--violeta-500)">1.8</span>Igualdad</span>
      <span class="score"><span class="pill" style="background: var(--azul-500)">2.2</span>Inclusión</span>
      <span class="score"><span class="pill" style="background: var(--ambar-500)">1.5</span>Cuidados</span>
      <span class="score"><span class="pill" style="background: var(--rosa-500)">3.0</span>Vida libre</span>
    </div>
  </div>
</body>
</html>
