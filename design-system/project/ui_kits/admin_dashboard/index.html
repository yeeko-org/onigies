<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>ONIGIES Admin — Resumen</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
</head>
<body>
  <div id="root" style="display:contents;"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="AdminTopBar.jsx"></script>
  <script type="text/babel" src="KpiRow.jsx"></script>
  <script type="text/babel" src="EvidenceTable.jsx"></script>
  <script type="text/babel" src="UploadCard.jsx"></script>
  <script type="text/babel" src="ActivityCard.jsx"></script>
  <script type="text/babel" src="IndexCalcCard.jsx"></script>

  <script type="text/babel">
    const App = () => {
      const [section, setSection] = React.useState('home');
      const [selectedId, setSelectedId] = React.useState('EVD-2026-00482');

      return (
        <React.Fragment>
          <Sidebar active={section} onSelect={setSection} />
          <main className="adm-main">
            <AdminTopBar />
            <div className="adm-workspace">
              <div className="adm-workspace__h">
                <div>
                  <h1 className="adm-workspace__title">Buen día, Mariana</h1>
                  <p className="adm-workspace__sub">
                    Tienes 84 evidencias por revisar y el cálculo del índice 2026 está al 80%.
                  </p>
                </div>
              </div>

              <KpiRow />

              <div className="adm-grid-2">
                <EvidenceTable selectedId={selectedId} onSelect={setSelectedId} />
                <IndexCalcCard />
              </div>

              <div className="adm-grid-2">
                <ActivityCard />
                <UploadCard />
              </div>
            </div>
          </main>
        </React.Fragment>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
