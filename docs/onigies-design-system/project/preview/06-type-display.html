<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Type · display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg-page); }
  .row { display: flex; align-items: baseline; gap: 24px; margin-bottom: 14px; }
  .meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-3);
          letter-spacing: 0.02em; min-width: 230px; flex-shrink: 0; }
  .meta b { font-family: var(--font-display); color: var(--fg-1); font-weight: 700;
            font-size: 12px; display: block; margin-bottom: 2px; text-transform: uppercase;
            letter-spacing: 0.10em; }
</style>
</head>
<body>
  <div class="row">
    <div class="meta"><b>Display XL</b>Plus Jakarta · 800 · 64 / 1.05 · -.02</div>
    <div class="t-display-xl">2.0&nbsp;de&nbsp;5</div>
  </div>
  <div class="row">
    <div class="meta"><b>Display</b>Plus Jakarta · 700 · 36 / 1.12 · -.015</div>
    <div class="t-display">Igualdad de género en las IES</div>
  </div>
  <div class="row">
    <div class="meta"><b>H1</b>Plus Jakarta · 700 · 30 / 1.2</div>
    <div class="t-h1">Resultados de las 48 instituciones</div>
  </div>
  <div class="row">
    <div class="meta"><b>H2</b>Plus Jakarta · 700 · 24 / 1.25</div>
    <div class="t-h2">Avance por eje</div>
  </div>
</body>
</html>
