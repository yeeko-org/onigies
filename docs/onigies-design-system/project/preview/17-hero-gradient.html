<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Hero gradient surface</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-page); }
  .hero { position: relative; height: 200px; border-radius: var(--radius-xl);
          overflow: hidden; box-shadow: var(--neu-raised);
          background:
            radial-gradient(120% 80% at 8% 14%,
              oklch(0.85 0.16 340 / 0.85) 0%,
              oklch(0.88 0.14 295 / 0.7) 30%,
              oklch(0.90 0.10 240 / 0.55) 55%,
              oklch(0.94 0.09 75 / 0.55) 100%),
            var(--bg-page);
          padding: 32px 40px; display: flex; flex-direction: column; justify-content: center; }
  .hero::after { content: ''; position: absolute; inset: 0;
                 background-image: radial-gradient(rgba(255,255,255,0.4) 1px, transparent 1px);
                 background-size: 3px 3px; opacity: 0.4; mix-blend-mode: overlay; }
  .eye { font-family: var(--font-body); font-weight: 700; font-size: 11px;
         letter-spacing: 0.18em; text-transform: uppercase;
         color: var(--primary-700); position: relative; z-index: 1;}
  .h { font-family: var(--font-display); font-weight: 800; font-size: 34px;
       line-height: 1.08; letter-spacing: -0.02em; color: var(--neutral-900);
       margin-top: 10px; max-width: 70%; position: relative; z-index: 1;}
  .sub { font-family: var(--font-body); font-size: 14px; color: var(--neutral-700);
         margin-top: 10px; position: relative; z-index: 1; max-width: 60%;}
</style>
</head>
<body>
  <div class="hero">
    <div class="eye">Resultados 2026</div>
    <div class="h">El avance de las 48 IES en igualdad de género</div>
    <div class="sub">Pastel-gradient hero · oklch blend · grain overlay · no decorative SVG.</div>
  </div>
</body>
</html>
