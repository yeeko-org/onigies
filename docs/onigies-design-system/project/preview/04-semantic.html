<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Semantic colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&display=block" rel="stylesheet">
<style>
  body { margin: 0; padding: 28px; background: var(--bg-page); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .card { background: var(--bg-page); border-radius: var(--radius-md);
          padding: 16px 18px; box-shadow: var(--neu-raised-sm);
          display: flex; align-items: flex-start; gap: 14px; }
  .ico { width: 40px; height: 40px; border-radius: var(--radius-pill);
         display: flex; align-items: center; justify-content: center;
         flex-shrink: 0; }
  .ico .material-symbols-rounded { font-size: 22px; }
  .meta .label { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--fg-1); }
  .meta .hex { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-3); margin-top: 2px; }
  .meta .use { font-family: var(--font-body); font-size: 11px; color: var(--fg-2); margin-top: 6px; line-height: 1.45; }

  .succ .ico { background: var(--success-tint); color: var(--success); }
  .warn .ico { background: var(--warning-tint); color: var(--warning); }
  .dang .ico { background: var(--danger-tint);  color: var(--danger); }
  .info .ico { background: var(--info-tint);    color: var(--info); }
</style>
</head>
<body>
  <div class="row">
    <div class="card succ">
      <div class="ico"><span class="material-symbols-rounded">check_circle</span></div>
      <div class="meta">
        <div class="label">Success</div>
        <div class="hex">#2E9B6E</div>
        <div class="use">Datos publicados, evidencia aprobada</div>
      </div>
    </div>
    <div class="card warn">
      <div class="ico"><span class="material-symbols-rounded">warning</span></div>
      <div class="meta">
        <div class="label">Warning</div>
        <div class="hex">#F2A53A</div>
        <div class="use">Acción requerida, datos por revisar</div>
      </div>
    </div>
    <div class="card dang">
      <div class="ico"><span class="material-symbols-rounded">error</span></div>
      <div class="meta">
        <div class="label">Danger</div>
        <div class="hex">#D9434A</div>
        <div class="use">Errores, evidencia rechazada</div>
      </div>
    </div>
    <div class="card info">
      <div class="ico"><span class="material-symbols-rounded">info</span></div>
      <div class="meta">
        <div class="label">Info</div>
        <div class="hex">#2E8FCC</div>
        <div class="use">Avisos, cambios metodológicos</div>
      </div>
    </div>
  </div>
</body>
</html>
