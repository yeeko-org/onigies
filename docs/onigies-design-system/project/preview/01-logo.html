<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-page); }
  .row { display: flex; align-items: center; gap: 32px; }
  .pad { display: flex; align-items: center; justify-content: center;
         width: 140px; height: 140px; border-radius: var(--radius-lg);
         background: var(--bg-page); box-shadow: var(--neu-raised); }
  .pad img { width: 96px; height: 96px; }
  .dark { background: var(--neutral-900); box-shadow: none; }
  .dark img { filter: brightness(0) invert(1); }
  .mono { background: var(--bg-page); box-shadow: var(--neu-inset); }
  .mono img { filter: grayscale(1) brightness(0.4); }
  .label { font-family: var(--font-body); font-size: 12px; color: var(--fg-3);
           margin-top: 10px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700;
           text-align: center; }
  .wordmark { font-family: var(--font-display); font-weight: 800; font-size: 28px;
              letter-spacing: -0.01em; color: var(--fg-1); }
  .wordmark .sub { display: block; font-family: var(--font-body); font-weight: 500;
                   font-size: 11px; letter-spacing: 0.08em; color: var(--fg-3);
                   text-transform: uppercase; margin-top: 4px; }
  .cell { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>
  <div class="row">
    <div class="cell"><div class="pad"><img src="../assets/logo-onigies.svg" alt=""></div><div class="label">Mark</div></div>
    <div class="cell"><div class="pad dark"><img src="../assets/logo-onigies.svg" alt=""></div><div class="label">Reverse</div></div>
    <div class="cell"><div class="pad mono"><img src="../assets/logo-onigies.svg" alt=""></div><div class="label">Mono</div></div>
    <div class="cell">
      <div class="wordmark">ONIGIES<span class="sub">Observatorio Nacional · Igualdad de Género · IES</span></div>
      <div class="label" style="margin-top:14px;">Wordmark lockup</div>
    </div>
  </div>
</body>
</html>
