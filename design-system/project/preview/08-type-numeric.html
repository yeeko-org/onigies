<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Type · numeric</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg-page); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .card { background: var(--bg-page); border-radius: var(--radius-lg);
          padding: 20px 22px; box-shadow: var(--neu-raised); }
  .label { font-family: var(--font-body); font-weight: 600; font-size: 11.5px;
           color: var(--fg-3); letter-spacing: 0.08em; text-transform: uppercase;
           margin-bottom: 10px; }
  .delta { font-family: var(--font-body); font-weight: 600; font-size: 12px;
           color: var(--success); margin-top: 4px;
           font-variant-numeric: tabular-nums; }
  .delta.down { color: var(--danger); }
  .sub { font-family: var(--font-body); font-size: 11.5px; color: var(--fg-3); margin-top: 4px;}
</style>
</head>
<body>
  <div class="row">
    <div class="card">
      <div class="label">Índice nacional</div>
      <div class="t-numeric-xl" style="color: var(--primary-700)">2.0</div>
      <div class="sub">de 5</div>
      <div class="delta">+0.2 vs 2024</div>
    </div>
    <div class="card">
      <div class="label">IES participantes</div>
      <div class="t-numeric-xl" style="color: var(--azul-600)">48</div>
      <div class="sub">de 132 nacionales</div>
      <div class="delta">+6 vs 2024</div>
    </div>
    <div class="card">
      <div class="label">Eje mejor evaluado</div>
      <div class="t-numeric" style="color: var(--rosa-600); margin-top: 14px">3.0</div>
      <div class="sub">Vida libre</div>
      <div class="delta">+0.4 vs 2024</div>
    </div>
    <div class="card">
      <div class="label">Eje en atención</div>
      <div class="t-numeric" style="color: var(--ambar-700); margin-top: 14px">1.5</div>
      <div class="sub">Cuidados</div>
      <div class="delta down">−0.1 vs 2024</div>
    </div>
  </div>
</body>
</html>
